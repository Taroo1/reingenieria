# Infraestructura de datos (Etapa 2) y simulador de proveedores (Etapa 3).
# El backend corre en el host (npm run start:dev); el frontend se agrega en la Etapa 4.
name: mundoglobal-travel

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Proveedores ficticios con API HTTP propia y fallas inyectables (Etapa 3).
  provider-simulator:
    build: ./provider-simulator
    restart: unless-stopped
    environment:
      PORT: "4100"
      SIMULATOR_ADMIN_TOKEN: ${SIMULATOR_ADMIN_TOKEN:-}
      SIMULATOR_API_KEY: ${SIMULATOR_API_KEY:-}
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-4100}:4100"

volumes:
  pgdata:
